name: Build KANASHI-Flix APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -not -path '*/.gradle/*' | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: File gradlew tidak ditemukan."
            echo "Periksa apakah proyek Android sudah diekstrak."
            find . -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KANASHI-Flix-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error