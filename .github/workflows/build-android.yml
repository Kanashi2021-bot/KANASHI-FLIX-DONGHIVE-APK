name: Build KANASHI-Flix APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Find Android project
    id: project
    shell: bash
    run: |
      GRADLEW=$(find . -type f -name gradlew -not -path '*/.gradle/*' | head -n 1)
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: gradlew tidak ditemukan. Pastikan proyek Android sudah diekstrak."
        find . -maxdepth 3 -type f | head -n 80
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLEW")
      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      echo "Proyek Android ditemukan: $PROJECT_DIR"

  - name: Build APK
    working-directory: .
    shell: bash
    run: |
      cd "${{ steps.project.outputs.dir }}"
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: KANASHI-Flix-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error 