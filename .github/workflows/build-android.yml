name: Build KANASHI-Flix APK

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract project ZIP
    shell: bash
    run: |
      set -e
      unzip -o KANASHI-Flix-katalog-build.zip -d extracted
      test -f extracted/kanashi_flix/settings.gradle.kts
      echo "Proyek KANASHI-Flix berhasil diekstrak."

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.3.1'

  - name: Build APK
    shell: bash
    run: |
      gradle --no-daemon -p extracted/kanashi_flix assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: KANASHI-Flix-APK
      path: extracted/kanashi_flix/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14