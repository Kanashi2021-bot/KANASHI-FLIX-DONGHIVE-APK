name: Build KANASHI-Flix APK
on: [push, workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Ambil kode proyek
uses: actions/checkout@v4

  - name: Siapkan Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Periksa struktur proyek
    run: |
      echo "Daftar file proyek:"
      find . -maxdepth 3 -type f | head -100
      echo "Mencari Gradle wrapper..."
      find . -type f -name gradlew

  - name: Build APK
    run: |
      GRADLEW=$(find . -type f -name gradlew | head -1)
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: Gradle wrapper tidak ditemukan."
        exit 1
      fi
      DIR=$(dirname "$GRADLEW")
      cd "$DIR"
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Simpan APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: KANASHI-Flix-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error